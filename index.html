---
layout: default
---
<section class="hero">
  <h1>{{ site.title }}</h1>
  <p class="lede">{{ site.tagline }}</p>
</section>

<div class="card-grid topics">
  {% for cat in site.categories %}
    <a class="card topic" href="{{ '/' | append: cat.key | append: '/' | relative_url }}">
      <div class="card-body">
        <h2>{{ cat.name }}</h2>
        <p>{{ cat.blurb }}</p>
        <span class="go">View tools →</span>
      </div>
    </a>
  {% endfor %}
</div>
